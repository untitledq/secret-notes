# GitLab CI/CD pipeline for Secret Notes (Frontend)

# Required pipeline stages (per project specification):
# 1. Linting
# 2. Unit Testing
# 3. Build (Docker image)
# 4. Deliver (push to Docker Hub)
# 5. Deploy (AWS + Blue/Green + E2E/Performance tests)

stages:
  - lint
  - test
  - build
  - deliver
  - deploy


# 1. Linting Stage
lint-frontend:
  stage: lint
  image: node:20
  rules:
    - changes:
        - frontend/**
  script:
    - cd frontend
    - echo "TODO: add frontend linting + SonarQube scan"


# 2. Unit Testing Stage
test-frontend:
  stage: test
  image: node:20
  rules:
    - changes:
        - frontend/**
  script:
    - cd frontend
    - echo "TODO: add frontend tests (Jest / Playwright)"


# 3. Build Stage (Docker)
build-frontend:
  stage: build
  image: docker:latest
  rules:
    - changes:
        - frontend/**
  services:
    - docker:dind
  script:
    - docker build -t secret-notes-frontend ./frontend


