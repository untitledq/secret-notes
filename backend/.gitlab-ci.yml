# GitLab CI/CD pipeline for Secret Notes (Backend)

# Required pipeline stages (per project specification):
# 1. Linting
# 2. Unit Testing
# 3. Build (Docker image)
# 4. Deliver (push to Docker Hub)
# 5. Deploy (AWS + Blue/Green + E2E/Performance tests)

workflow:
  rules:
    - changes:
        - backend/**
    - when: never

stages:
  - lint
  - test
  - build
  - deliver
  - deploy

lint-backend:
  stage: lint
  image: node:20
  script:
    - cd backend
    - npm install
    - echo "TODO add ESLint + SonarQube scan"

test-backend:
  stage: test
  image: node:20
  script:
    - cd backend
    - npm install
    - npm test

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t secret-notes-backend ./backend

