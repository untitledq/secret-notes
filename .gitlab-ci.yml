# GitLab CI/CD pipeline for Secret Notes

# Required pipeline stages:
# 1. Linting
# 2. Unit Testing
# 3. Build (Docker image)
# 4. Deliver (push to Docker Hub)
# 5. Deploy (AWS + Blue/Green + E2E/Performance tests)

stages:
  - lint
  - test
  - build
  - deliver
  - deploy

# =====================================================
# BACKEND
# =====================================================

lint-backend:
  stage: lint
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd backend
    - npm install
    - npx eslint .

test-backend:
  stage: test
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  services:
    - name: postgres:17.4-alpine3.21
      alias: postgres
  variables:
    POSTGRES_DB: secret_notes
    POSTGRES_USER: secret
    POSTGRES_PASSWORD: secret
    DATABASE_URL: postgresql://secret:secret@postgres:5432/secret_notes
  script:
    - cd backend
    - npm install
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -U secret; do sleep 1; done
    - npx prisma generate
    - npx prisma migrate deploy
    - npm test

    - echo "TODO SonarQube scan"
    - curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-7.3.0.5189-linux-x64.zip
    - unzip -q sonar-scanner.zip
    - export PATH="$PATH:$PWD/sonar-scanner-7.3.0.5189-linux-x64/bin"
    - sonar-scanner
      -Dsonar.projectKey=secret-notes-backend
      -Dsonar.sources=backend
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true

    - echo "Snyk test"
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test

build-backend:
  stage: build
  image: docker:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  services:
    - docker:dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest


