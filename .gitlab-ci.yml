# GitLab CI/CD pipeline for Secret Notes

# Required pipeline stages:
# 1. Linting
# 2. Unit Testing
# 3. Build (Docker image)
# 4. Deliver (push to Docker Hub)
# 5. Deploy (AWS + Blue/Green + E2E/Performance tests)

stages:
  - lint
  - snyk
  - sonar
  - test
  - build
  - deliver
  - deploy
  - performance
  - notify

# =====================================================
# BACKEND
# =====================================================

lint-backend:
  stage: lint
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - cd backend
    - npm ci
    - npx eslint .

snyk-backend:
  stage: snyk
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - echo "Snyk test backend"
    - cd backend 
    - npm ci
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test 

sonar-backend:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:12.1
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    paths:
      - .sonar/cache
  script:
    - echo "SonarQube test"
    - cd backend
    - npm ci
    - |
      sonar-scanner \
        -Dsonar.projectKey=secret-notes-backend \
        -Dsonar.sources=. \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.token=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true

test-backend:
  stage: test
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'

  services:
    - name: postgres:17.4-alpine3.21
      alias: postgres

  variables:
    POSTGRES_DB: secret_notes
    POSTGRES_USER: secret
    POSTGRES_PASSWORD: secret
    DATABASE_URL: postgresql://secret:secret@postgres:5432/secret_notes

  script:
    - cd backend
    - npm ci
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -U secret; do sleep 1; done
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - backend/coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - echo "Build"
    - docker build -t secret-notes-backend:$CI_COMMIT_SHORT_SHA ./backend
    # Push to GitLab registry (artifact storage)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag secret-notes-backend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker tag secret-notes-backend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest

deliver-backend:
  stage: deliver
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    # 1. Pull von der GitLab Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    
    # 2. Sauber re-taggen (Der Sonar-Müll ist hier jetzt komplett gelöscht!)
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA secret-notes-backend:$CI_COMMIT_SHORT_SHA
    
    # 3. Login bei Docker Hub und Push (wurde wieder hinzugefügt, damit das Deployment ein Image hat!)
    - echo "$DOCKERHUB_PASSWORD_NEW" | docker login -u "$DOCKERHUB_USER_NEW" --password-stdin
    - docker tag secret-notes-backend:$CI_COMMIT_SHORT_SHA $DOCKERHUB_USER_NEW/secret-notes-backend:$CI_COMMIT_SHORT_SHA
    - docker tag secret-notes-backend:$CI_COMMIT_SHORT_SHA $DOCKERHUB_USER_NEW/secret-notes-backend:latest
    - docker push $DOCKERHUB_USER_NEW/secret-notes-backend:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKERHUB_USER_NEW/secret-notes-backend:latest

deploy-backend-staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - deliver-backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  variables:
    BACKEND_DOCKER_IMAGE: "$DOCKERHUB_USER_NEW/secret-notes-backend:$CI_COMMIT_SHORT_SHA"
    BACKEND_CONTAINER_NAME: "secret-notes-backend-green"
    BACKEND_PORT: "3001"
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$BACKEND_STAGING_DATABASE_URL" || (echo "BACKEND_STAGING_DATABASE_URL is missing" && exit 1) 
    - chmod 400 "$BACKEND_STAGING_EC2_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$BACKEND_STAGING_EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh -i "$BACKEND_STAGING_EC2_SSH_PRIVATE_KEY" "$BACKEND_STAGING_EC2_USER@$BACKEND_STAGING_EC2_HOST" "
        set -e

        docker pull $BACKEND_DOCKER_IMAGE

        docker run --rm \
          -e DATABASE_URL='$BACKEND_STAGING_DATABASE_URL' \
          $BACKEND_DOCKER_IMAGE \
          npx prisma migrate deploy

        docker stop $BACKEND_CONTAINER_NAME || true
        docker rm $BACKEND_CONTAINER_NAME || true

        docker run -d \
          --name $BACKEND_CONTAINER_NAME \
          --restart unless-stopped \
          -p $BACKEND_PORT:3000 \
          -e NODE_ENV=production \
          -e RATE_LIMIT_MAX=1000 \
          -e DATABASE_URL='$BACKEND_STAGING_DATABASE_URL' \
          $BACKEND_DOCKER_IMAGE

        sleep 5
        curl -fsS http://localhost:$BACKEND_PORT/health
      "
  environment:
    name: backend-staging
    url: "http://$BACKEND_STAGING_EC2_HOST:3001"


# =====================================================
# FRONTEND
# =====================================================

lint-frontend:
  stage: lint
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - cd frontend
    - npm ci
    - npm run lint

snyk-frontend:
  stage: snyk
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - echo "Snyk test frontend"
    - cd frontend
    - npm ci
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test

sonar-frontend:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:12.1
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    paths:
      - .sonar/cache
  script:
    - cd frontend
    - |
      sonar-scanner \
        -Dsonar.projectKey=secret-notes-frontend \
        -Dsonar.sources=. \
        -Dsonar.exclusions=node_modules/**,coverage/** \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.token=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true

test-frontend:
  stage: test
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - cd frontend
    - npm ci
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# Build-Check
build-frontend:
  stage: build
  image: docker:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  services:
    - docker:dind
  script:
    - docker build -f frontend/Dockerfile -t secret-notes-frontend:$CI_COMMIT_SHORT_SHA .

# =====================================================
# PERFORMANCE TESTING (k6) - AWS staging backend
# =====================================================

performance-backend-k6:
  stage: performance
  image:
    name: grafana/k6:0.54.0
    entrypoint: [""]
  needs:
    - deploy-backend-staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  variables:
    K6_VUS: "3"
    K6_DURATION: "30s"
    K6_P95_THRESHOLD: "1000"
    K6_ERROR_RATE_THRESHOLD: "0.01"
  script:
    - K6_BASE_URL="http://$BACKEND_STAGING_EC2_HOST:3001" k6 run --summary-export performance/k6/k6-summary.json performance/k6/notes-performance.js
  artifacts:
    when: always
    paths:
      - performance/k6/k6-summary.json

# =====================================================
# E2E TESTING (Playwright) - Staging-Frontend
# =====================================================

e2e-frontend:
  stage: performance
  image: mcr.microsoft.com/playwright:v1.61.1-jammy
  needs:
    - deploy-backend-staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - test -n "$FRONTEND_URL" || (echo "FRONTEND_URL is missing" && exit 1)
    - npm ci
    - npx playwright test e2e/playwright
  artifacts:
    when: always
    paths:
      - playwright-report
      - test-results

notify-failure-slack:
  stage: notify
  image: curlimages/curl:latest
  when: on_failure
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - |
      curl -X POST -H 'Content-type: application/json' \
      --data "{\"text\":\"Pipeline failed: $CI_PROJECT_NAME / $CI_COMMIT_BRANCH\n$CI_PIPELINE_URL\"}" \
      "$SLACK_WEBHOOK_URL"
