# GitLab CI/CD pipeline for Secret Notes

# Required pipeline stages:
# 1. Linting
# 2. Unit Testing
# 3. Build (Docker image)
# 4. Deliver (push to Docker Hub)
# 5. Deploy (AWS + Blue/Green + E2E/Performance tests)

stages:
  - lint
  - snyk
  - sonar
  - test
  - build
  - deliver
  - deploy

# =====================================================
# BACKEND
# =====================================================

lint-backend:
  stage: lint
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd backend
    - npm ci
    - npx eslint .

snyk-backend:
  stage: snyk
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Snyk test backend"
    - cd backend
    - npm ci
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test

sonar-backend:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:12.1
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    paths:
      - .sonar/cache
  script:
    - echo "SonarQube test"
    - cd backend
    - npm ci
    - |
      sonar-scanner \
        -Dsonar.projectKey=secret-notes-backend \
        -Dsonar.sources=. \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.token=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true

test-backend:
  stage: test
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  services:
    - name: postgres:17.4-alpine3.21
      alias: postgres

  variables:
    POSTGRES_DB: secret_notes
    POSTGRES_USER: secret
    POSTGRES_PASSWORD: secret
    DATABASE_URL: postgresql://secret:secret@postgres:5432/secret_notes

  script:
    - cd backend
    - npm ci
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -U secret; do sleep 1; done
    - npx prisma generate
    - npx prisma migrate deploy
    - npm test

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Build"
    - docker build -t secret-notes-backend:$CI_COMMIT_SHA ./backend
    # Push to GitLab registry (artifact storage)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag secret-notes-backend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker tag secret-notes-backend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest

deliver-backend:
  stage: deliver
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    # Pull from GitLab registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    # Re-tag locally
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA secret-notes-backend:$CI_COMMIT_SHA
    # Docker Hub delivery
    - echo "$DOCKERHUB_PASSWORD_NEW" | docker login -u "$DOCKERHUB_USER_NEW" --password-stdin
    - docker tag secret-notes-backend:$CI_COMMIT_SHA $DOCKERHUB_USER_NEW/secret-notes-backend:$CI_COMMIT_SHA
    - docker tag secret-notes-backend:$CI_COMMIT_SHA $DOCKERHUB_USER_NEW/secret-notes-backend:latest
    - docker push $DOCKERHUB_USER_NEW/secret-notes-backend:$CI_COMMIT_SHA
    - docker push $DOCKERHUB_USER_NEW/secret-notes-backend:latest



