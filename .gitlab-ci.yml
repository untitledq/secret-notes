
# GitLab CI/CD pipeline for Secret Notes

# Required pipeline stages:
# 1. Linting
# 2. Unit Testing
# 3. Build (Docker image)
# 4. Deliver (push to Docker Hub)
# 5. Deploy (AWS + Blue/Green + E2E/Performance tests)

stages:
  - lint
  - test
  - build
  - deliver
  - deploy

# =====================================================
# BACKEND
# =====================================================

lint-backend:
  stage: lint
  image: node:20
  rules:
    - changes:
        - backend/**
  script:
    - cd backend
    - npm install
    - echo "TODO ESLint + SonarQube scan"

test-backend:
  stage: test
  image: node:20
  rules:
    - changes:
        - backend/**
  script:
    - cd backend
    - npm install
    - npm test

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  rules:
    - changes:
        - backend/**
  script:
    - docker build -t secret-notes-backend ./backend

