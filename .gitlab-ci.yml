# =====================================================
# FRONTEND
# =====================================================

lint-frontend:
  stage: lint
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd frontend
    # basic HTML validation using tidy (lightweight, no Node project needed)
    - apt-get update && apt-get install -y tidy
    # intentionally weak / nonblocking for now
    - tidy -q -e index.html || true

