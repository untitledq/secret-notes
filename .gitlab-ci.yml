# =====================================================
# PERFORMANCE TESTING (k6) - AWS staging backend
# =====================================================

performance-backend-k6:
  stage: performance
  image:
    name: grafana/k6:0.54.0
    entrypoint: [""]
  needs:
    - deploy-backend-staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  variables:
    K6_VUS: "1"
    K6_DURATION: "1s"
    K6_P95_THRESHOLD: "1000"
    K6_ERROR_RATE_THRESHOLD: "0.01"
  script:
    - K6_BASE_URL="http://$BACKEND_STAGING_EC2_HOST:3000" k6 run --summary-export performance/k6/k6-summary.json performance/k6/notes-performance.js
  artifacts:
    when: always
    paths:
      - performance/k6/k6-summary.json

