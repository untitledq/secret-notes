# GitLab CI/CD pipeline for Secret Notes

# Required pipeline stages:
# 1. Linting
# 2. Unit Testing
# 3. Build (Docker image)
# 4. Deliver (push to Docker Hub)
# 5. Deploy (AWS + Blue/Green + E2E/Performance tests)

stages:
  - lint
  - snyk
  - sonar
  - test
  - build
  - deliver
  - deploy
  - performance
  - notify

# =====================================================
# BACKEND
# =====================================================

lint-backend:
  stage: lint
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - cd backend
    - npm ci
    - npx eslint .

snyk-backend:
  stage: snyk
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  script:
    - echo "Snyk test backend"
    - cd backend
    - npm ci
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test

sonar-backend:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:12.1
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    paths:
      - .sonar/cache
  script:
    - echo "SonarQube test"
    - cd backend
    - npm ci
    - |
      sonar-scanner \
        -Dsonar.projectKey=secret-notes-backend \
        -Dsonar.sources=. \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.token=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true

test-backend:
  stage: test
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'

  services:
    - name: postgres:17.4-alpine3.21
      alias: postgres

  variables:
    POSTGRES_DB: secret_notes
    POSTGRES_USER: secret
    POSTGRES_PASSWORD: secret
    DATABASE_URL: postgresql://secret:secret@postgres:5432/secret_notes

  script:
    - cd backend
    - npm ci
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -U secret; do sleep 1; done
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - backend/coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
    - if: '$CI_COMMIT_BRANCH == "feature/jenkins"'
  script:
    - echo "Build"
    - docker build -t secret-notes-backend:$CI_COMMIT_SHA ./backend
    # Push to GitLab registry (artifact storage)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag secret-notes-backend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker tag secret-notes-backend:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest

deliver-backend:
  stage: deliver
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
    - if: '$CI_COMMIT_BRANCH == "feature/jenkins"'
  script:
    # Pull from GitLab registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    # Re-tag locally
    - docker tag $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA secret-notes-backend:$CI_COMMIT_SHA
    # Docker Hub delivery
    - echo "$DOCKERHUB_PASSWORD_NEW" | docker login -u "$DOCKERHUB_USER_NEW" --password-stdin
    - docker tag secret-notes-backend:$CI_COMMIT_SHA $DOCKERHUB_USER_NEW/secret-notes-backend:$CI_COMMIT_SHA
    - docker tag secret-notes-backend:$CI_COMMIT_SHA $DOCKERHUB_USER_NEW/secret-notes-backend:latest
    - docker push $DOCKERHUB_USER_NEW/secret-notes-backend:$CI_COMMIT_SHA
    - docker push $DOCKERHUB_USER_NEW/secret-notes-backend:latest

deploy-backend-staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - deliver-backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/production"'
    - if: '$CI_COMMIT_BRANCH == "feature/jenkins"'
  variables:
    BACKEND_DOCKER_IMAGE: "$DOCKERHUB_USER_NEW/secret-notes-backend:$CI_COMMIT_SHA"
    BACKEND_CONTAINER_NAME: "secret-notes-backend-green" 
    BACKEND_PORT: "3001"                                  
  script:
    - |
      ssh -i "$BACKEND_STAGING_EC2_SSH_PRIVATE_KEY" "$BACKEND_STAGING_EC2_USER@$BACKEND_STAGING_EC2_HOST" "
        set -e
        echo '$DOCKERHUB_PASSWORD_NEW' | docker login -u '$DOCKERHUB_USER_NEW' --password-stdin
        docker pull $BACKEND_DOCKER_IMAGE

        # Löscht den alten Container automatisch, falls er existiert
        docker stop $BACKEND_CONTAINER_NAME || true
        docker rm $BACKEND_CONTAINER_NAME || true

        # Startet den neuen Container auf Port 3001
        docker run -d \
          --name $BACKEND_CONTAINER_NAME \
          --restart unless-stopped \
          -p $BACKEND_PORT:3000 \
          -e NODE_ENV=production \
          -e DATABASE_URL='$BACKEND_STAGING_DATABASE_URL' \
          $BACKEND_DOCKER_IMAGE
      "

