# =====================================================
# FRONTEND
# =====================================================

lint-frontend:
  stage: lint
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd frontend
    # basic HTML validation using tidy (lightweight, no Node project needed)
    - apt-get update && apt-get install -y tidy
    # intentionally weak / nonblocking for now
    - tidy -q -e index.html || true

test-frontend:
  stage: test
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd frontend
    # basic smoke check: file exists and is non-empty
    - test -s index.html
    - echo "Frontend smoke test passed"

build-frontend:
  stage: build
  image: docker:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  services:
    - docker:dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest


