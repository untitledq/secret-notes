# GitLab CI/CD pipeline for Secret Notes

# Required pipeline stages:
# 1. Linting
# 2. Unit Testing
# 3. Build (Docker image)
# 4. Deliver (push to Docker Hub)
# 5. Deploy (AWS + Blue/Green + E2E/Performance tests)

stages:
  - lint
  - test
  - build
  - deliver
  - deploy

# =====================================================
# BACKEND
# =====================================================

lint-backend:
  stage: lint
  image: node:20
  rules:
    - changes:
        - backend/**
  script:
    - cd backend
    - npm install
    - npx eslint .

test-backend:
  stage: test
  image: node:20
  rules:
    - changes:
        - backend/**
  services:
    - name: postgres:17.4-alpine3.21
      alias: postgres
  variables:
    POSTGRES_DB: secret_notes
    POSTGRES_USER: secret
    POSTGRES_PASSWORD: secret
    DATABASE_URL: postgresql://secret:secret@postgres:5432/secret_notes
  script:
    - cd backend
    - npm install
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -U secret; do sleep 1; done
    - npx prisma generate
    - npx prisma migrate deploy
    - npx prisma db pull
    - npm test
    - echo "TODO SonarQube scan"
    - echo "TODO Snyk test"

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  rules:
    - changes:
        - backend/**
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA ./backend
#    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA

