- name: Update packages (Debian)
  apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install Docker (Debian)
  apt:
    name: docker.io
    state: present
  when: ansible_os_family == "Debian"

- name: Install Docker (RedHat)
  yum:
    name: docker
    state: present
  when: ansible_os_family == "RedHat"

- name: Start Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group (Debian)
  user:
    name: ubuntu
    groups: docker
    append: yes
  when: ansible_os_family == "Debian"

- name: Add user to docker group (RedHat)
  user:
    name: ec2-user
    groups: docker
    append: yes
  when: ansible_os_family == "RedHat"