services:
  database:
    image: postgres:17.4-alpine3.21
    container_name: secret-notes-db
    environment:
      POSTGRES_DB: secret_notes
      POSTGRES_USER: secret
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secret -d secret_notes"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: secret-notes-backend
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    env_file:
    - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://secret:secret@database:5432/secret_notes
    command: >
      sh -c "
        until nc -z database 5432; do sleep 1; done;
        npx prisma migrate deploy &&
        node src/index.js
      "
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: secret-notes-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
