services:
  database:
    image: postgres:17.4-alpine3.21
    container_name: secret-notes-db
    environment:
      POSTGRES_DB: secret_notes
      POSTGRES_USER: secret
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: secret-notes-backend
    ports:
      - "3000:3000"
    depends_on:
      - database
    env_file:
    - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://secret:secret@database:5432/secret_notes
    command: >
      sh -c "
        until nc -z database 5432; do sleep 1; done;
        npx prisma migrate deploy &&
        node src/index.js
      "

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: secret-notes-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
